[package]
name = "rabuka_3ds"
version = "0.1.0"
edition = "2021"

[dependencies]
rabuka_engine = { path = "../engine", default-features = false, features = ["3ds"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
rmp-serde = "1.3.1"

[features]
default = []
3ds = []

[[bin]]
name = "rabuka_3ds"
path = "src/bin/rabuka_3ds.rs"



[profile.release]
# Split into multiple codegen units to avoid LLVM stack overflow
# during cross-compilation (STATUS_STACK_BUFFER_OVERRUN on Windows).
codegen-units = 16
lto = false
opt-level = 2
[package.metadata.cargo-3ds]
romfs_dir = "romfs"
