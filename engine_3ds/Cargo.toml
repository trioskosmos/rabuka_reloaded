[package]
name = "rabuka_3ds"
version = "0.1.0"
edition = "2021"

[dependencies]
rabuka_engine = { path = "../engine", default-features = false }
rmp-serde = "1.3.1"
serde_json = "1.0"

[features]
default = []
3ds = ["rabuka_engine/3ds"]

[[bin]]
name = "rabuka_3ds"
path = "src/bin/rabuka_3ds.rs"

[[bin]]
name = "bake"
path = "src/bin/bake.rs"



[profile.release]
# Split into multiple codegen units to avoid LLVM stack overflow
# during cross-compilation (STATUS_STACK_BUFFER_OVERRUN on Windows).
codegen-units = 16
lto = false
opt-level = 2
[package.metadata.cargo-3ds]
romfs_dir = "romfs"
