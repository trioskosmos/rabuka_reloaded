[package]
name = "rabuka_engine"
version = "0.1.0"
edition = "2021"

[profile.dev]
opt-level = 1
debug = 0
incremental = true
codegen-units = 16

[profile.test]
opt-level = 1
debug = 1
incremental = true
codegen-units = 16

[lib]
test = false
doctest = false

[dependencies]
log = { version = "=0.4.22", default-features = false }
env_logger = { version = "0.11", optional = true }
serde = { version = "=1.0.228", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "=1.0.99", default-features = false, features = ["alloc"] }
rand = { version = "0.8", optional = true }
actix-web = { version = "4.4", optional = true }
actix-cors = { version = "0.6", optional = true }
actix-files = { version = "0.6", optional = true }
tokio = { version = "1.35", features = ["full"], optional = true }
smallvec = "1.11"
hashbrown = { version = "0.14", default-features = false, features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"], optional = true }
local-ip-address = { version = "0.6", optional = true }
tokio-stream = { version = "0.1", optional = true }
bytes = { version = "1", optional = true }
rmp-serde = { version = "=1.1.2", optional = true }
once_cell = { version = "1", default-features = false, features = ["alloc"], optional = true }
[features]
default = ["env_logger", "debug_conditions", "alloc_tracker", "rand", "rmp-serde"]
debug_conditions = []
# Optional server feature: enables the web server and async runtime
server = ["actix-web", "actix-cors", "actix-files", "tokio", "tokio-stream", "local-ip-address", "uuid", "bytes"]
# 3DS target: disables TLS-based RNG, uses xorshift64 seeded from svcGetSystemTick
3ds = []
# Profiling: enables Timer-based instrumentation for flamegraph generation
profiling = []
# Alloc tracker: counts every malloc/free, reports via RABUKA_ALLOC_TRACK env var
alloc_tracker = []
# Generic no_std flag — used in cfg gates so ports don't touch engine source
no_std = []
# PSP target: no_std + alloc mode for mipsel-sony-psp
psp = ["no_std", "once_cell", "debug_conditions"]
# Dreamcast target: no_std + alloc via KallistiOS + rustc_codegen_gcc
dc = ["no_std", "debug_conditions"]
# Bytecode abilities: use pre-compiled bytecode instead of JSON serde
# for ability loading. Dramatically reduces memory footprint (~7KB vs 1.4MB).
bytecode_abilities = []
# Lazy abilities: cards store AbilityRef (u16 index) instead of decoded Arc<Ability>.
# Abilities are decoded on demand from the bytecode blob and cached. Reduces resident
# ability RAM from ~2.8 MB (all 800 eagerly decoded) to a bounded on-demand cache.
# Implies bytecode_abilities.
lazy_abilities = ["bytecode_abilities"]

[dev-dependencies]
criterion = "0.5"
inferno = "0.12"
rayon = "1.8"
rand_chacha = "0.3"
bincode = "1.3"

[profile.bench]
debug = true

[[bench]]
name = "performance"
harness = false

[[bin]]
name = "rabuka_engine"
path = "src/main.rs"
test = false

[[bin]]
name = "profile_target"
path = "src/bin/profile_target.rs"
test = false

[[bin]]
name = "harness"
path = "src/bin/harness.rs"
test = false

[[bin]]
name = "rabuka_3ds"
path = "src/bin/rabuka_3ds.rs"
test = false

[[bin]]
name = "gen_abilities_map"
path = "src/bin/gen_abilities_map.rs"
required-features = ["rmp-serde"]
test = false

[[bin]]
name = "bot_demo"
path = "src/bin/bot_demo.rs"
test = false

[[bin]]
name = "bot_data_gen"
path = "src/bin/bot_data_gen.rs"
test = false

[[bin]]
name = "play_game"
path = "src/bin/play_game.rs"
test = false

[[bin]]
name = "collect_data"
path = "src/bin/collect_data.rs"
test = false
