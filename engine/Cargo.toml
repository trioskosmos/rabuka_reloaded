[package]
name = "rabuka_engine"
version = "0.1.0"
edition = "2021"

[profile.dev]
opt-level = 1
debug = 0
incremental = true
codegen-units = 16

[profile.test]
opt-level = 1
debug = 1
incremental = true
codegen-units = 16

[lib]
test = false
doctest = false

[dependencies]
log = "0.4"
env_logger = { version = "0.11", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
actix-web = { version = "4.4", optional = true }
actix-cors = { version = "0.6", optional = true }
actix-files = { version = "0.6", optional = true }
tokio = { version = "1.35", features = ["full"], optional = true }
smallvec = "1.11"
uuid = { version = "1.6", features = ["v4", "serde"], optional = true }
local-ip-address = { version = "0.6", optional = true }
tokio-stream = { version = "0.1", optional = true }
bytes = { version = "1", optional = true }
rmp-serde = "1.3.1"
inferno = "0.12"

[features]
default = ["env_logger", "debug_conditions", "alloc_tracker"]
debug_conditions = []
# Optional server feature: enables the web server and async runtime
server = ["actix-web", "actix-cors", "actix-files", "tokio", "tokio-stream", "local-ip-address", "uuid", "bytes"]
# 3DS target: disables TLS-based RNG, uses xorshift64 seeded from svcGetSystemTick
3ds = []
# Profiling: enables Timer-based instrumentation for flamegraph generation
profiling = []
# Alloc tracker: counts every malloc/free, reports via RABUKA_ALLOC_TRACK env var
alloc_tracker = []

[dev-dependencies]
criterion = "0.5"
inferno = "0.12"
rayon = "1.8"
rand_chacha = "0.3"
bincode = "1.3"

[profile.bench]
debug = true

[[bench]]
name = "performance"
harness = false

[[bin]]
name = "rabuka_engine"
path = "src/main.rs"
test = false

[[bin]]
name = "profile_target"
path = "src/bin/profile_target.rs"
test = false

[[bin]]
name = "harness"
path = "src/bin/harness.rs"
test = false

[[bin]]
name = "rabuka_3ds"
path = "src/bin/rabuka_3ds.rs"
test = false

[[bin]]
name = "gen_abilities_map"
path = "src/bin/gen_abilities_map.rs"
test = false

[[bin]]
name = "bot_demo"
path = "src/bin/bot_demo.rs"
test = false
