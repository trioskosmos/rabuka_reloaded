[package]
name = "rabuka_engine"
version = "0.1.0"
edition = "2021"

[profile.dev]
opt-level = 1
debug = 0
incremental = true
codegen-units = 16

[profile.test]
opt-level = 2
debug = 0
incremental = true
codegen-units = 1

[lib]
test = false
doctest = false

[dependencies]
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
actix-web = "4.4"
actix-cors = "0.6"
actix-files = "0.6"
tokio = { version = "1.35", features = ["full"] }
smallvec = "1.11"
uuid = { version = "1.6", features = ["v4", "serde"] }
local-ip-address = "0.6"
tokio-stream = "0.1"
bytes = "1"

[dev-dependencies]
criterion = "0.5"
rayon = "1.8"
rand_chacha = "0.3"

[[bench]]
name = "performance"
harness = false

[[bin]]
name = "rabuka_engine"
path = "src/main.rs"
test = false


