[package]
name = "rabuka_engine"
version = "0.1.0"
edition = "2021"

# Release builds previously took 86-126s after ANY edit to the lib, while the
# tests themselves run in 0.20s - i.e. 99.8% of a `cargo test --release` was
# compilation. Measured on this crate: 5.29 MB across 162 files, opt-level 3,
# no incremental cache, so every edit was a clean full rebuild.
#
# `incremental = true` is the fix and it costs a few percent of runtime, not
# correctness. It matters because arena measurements want release speed while
# compile checks want dev speed, and before this the only affordable loop was to
# skip release entirely - which is a bad habit when the thing being compiled is a
# simulator.
#
# `codegen-units = 16` is already the release default but interacts with
# incremental: more units means finer-grained reuse between edits.
[profile.release]
incremental = true
codegen-units = 1
# `lto = "thin"` + `codegen-units = 1` landed 2026-10-09 after the
# full suite ran to completion under it (4364/4364, 4.30s run; the
# earlier "kept aborting" did not reproduce — build is 8m37s for all
# ~27 bins plus the harness target). Measured with the pool active,
# interleaved in-process A/B: +5.6% jobs=1 (156,527 vs 148,295 mean
# aps) and +4.2% jobs=256 (859,422 vs 824,999), total_actions
# byte-identical (219,948) at both. lto = "fat" was measured earlier
# and is not worth it (+2-4% single-threaded, inside noise, appeared
# to cost throughput at high --jobs).
#
# PGO (profile-guided optimization) is NOT set here because it needs
# a RUSTFLAGS path to the committed profile, not a profile setting:
#
#   RUSTFLAGS="-Cprofile-use=pgo/merged.profdata" cargo build --release --bin sim_bench
#
# The profile (pgo/merged.profdata, ~1.9 MB) was trained 2026-10-09
# on the full 13-deck corpus (26,000 random-policy games, 4.29M
# actions, SIM_BENCH_WARMUP_SECS=0 — see the multi-deck warmup
# pathology note in docs/PERF_ENGINE_COMBINED.md §4.4). Interleaved
# A/B, pool+LTO active: +47.7% jobs=1 (230,207 vs 155,903 mean aps)
# and +47.0% jobs=256 (1,088,427 vs 740,209), total_actions
# byte-identical. LLVM matches profiles by function hash, so an
# engine edit degrades gracefully (edited functions lose their
# profile, the rest keep it) — but re-run the pipeline after
# significant engine changes:
#
#   rustup component add llvm-tools-preview          # once, for llvm-profdata
#   RUSTFLAGS="-Cprofile-generate=$env:TEMP\pgo" cargo build --release --bin sim_bench
#   $env:SIM_BENCH_WARMUP_SECS="0"                 # warmup seeds hit a
#   & .\target\release\sim_bench.exe --games 1000 --repeat 2 --seed 1 --policy random --jobs 4   # pathological (deck,seed) pair
#   llvm-profdata merge -o $env:TEMP\pgo\merged.profdata $env:TEMP\pgo\*.profraw
#   RUSTFLAGS="-Cprofile-use=$env:TEMP\pgo\merged.profdata" cargo build --release --bin sim_bench
lto = "thin"
# `panic = "abort"` removes the unwinding tables and landing pads from every
# function. This engine never catches a panic to recover - the arena treats a
# panic as a failed game - so the tables are pure codegen and link cost. It also
# shrinks the binary, which matters because 27 binaries link this crate.
panic = "abort"
# No symbols in the binary. Nothing profile-disassembles the arena, and this is
# measured, not assumed: stripping cuts link time on every one of the 27
# binaries that embed the engine.
strip = "symbols"

[lib]
doctest = false
# Every test in this crate -- including the ones that used to be in-source
# `#[cfg(test)] mod` blocks under src/ -- now lives in tests/run_all.rs.
# `cargo test` prints one `running N tests` / `test result:` pair per target,
# so leaving the lib harness on would always print a second, separate summary.
# The tests were moved rather than deleted: src/ lost its `#[cfg(test)] mod`
# blocks and tests/run_all.rs gained them, re-pointed from `crate::` to
# `rabuka_engine::`. Anything they touched that was private became `pub`.
test = false

[dependencies]
cfg-if = "1"
miniz_oxide = { version = "0.7", default-features = false, features = ["with-alloc"] }
log = { version = "=0.4.22", default-features = false }
env_logger = { version = "0.11", optional = true }
serde = { version = "=1.0.228", default-features = false, features = ["derive", "alloc", "rc"], optional = true }
serde_json = { version = "=1.0.99", default-features = false, features = ["alloc"], optional = true }
rand = { version = "0.8", optional = true }
actix-web = { version = "4.4", optional = true, default-features = false, features = ["macros", "compress-brotli", "compress-gzip", "cookies", "http2", "unicode", "compat", "ws"] }
actix-web-actors = { version = "4.3", optional = true }
actix = { version = "0.13", optional = true }
actix-cors = { version = "0.6", optional = true }
actix-files = { version = "0.6", optional = true }
tokio = { version = "1.35", features = ["full"], optional = true }
smallvec = { version = "1.11", default-features = false }
hashbrown = { version = "0.14", default-features = false }
uuid = { version = "1.6", features = ["v4", "serde"], optional = true }
local-ip-address = { version = "0.6", optional = true }
tokio-stream = { version = "0.1", optional = true }
bytes = { version = "1", optional = true }
rmp-serde = { version = "=1.3.1", optional = true }
criterion = { version = "0.5", optional = true }
inferno = { version = "0.12", optional = true }
[features]
default = ["env_logger", "debug_conditions", "rand", "rmp-serde", "bytecode_abilities", "compact_card_data", "serde_support", "fast_alloc"]
debug_conditions = []
# JSON-path ability decode (serde)  Eused only by the bytecode↔JSON deep-compare
# oracle. Off for ds/no_std targets so the serde decode system is not compiled.
json_path_test = ["serde_support"]
# serde + serde_json + serde-capable smallvec/hashbrown. Disabled for console
# targets (ds/ps1/psp/wii/dc) where types are serialized via the binary blob.
serde_support = ["dep:serde", "dep:serde_json", "smallvec/serde", "hashbrown/serde"]
# Optional server feature: enables the web server and async runtime
server = ["actix-web", "actix-web-actors", "actix", "actix-cors", "actix-files", "tokio", "tokio-stream", "local-ip-address", "uuid", "bytes", "serde_support"]
# 3DS target: disables TLS-based RNG, uses xorshift64 seeded from svcGetSystemTick
3ds = ["bytecode_abilities"]
# Profiling: enables Timer-based instrumentation and bench/flamegraph tooling
profiling = ["dep:criterion", "dep:inferno"]
# Headless bot-testing mode: compiles out UI-only bookkeeping (rule/structured
# logs, phase-transition log entries, choice_resolved capture, jyouji status
# strings). Gameplay-relevant tracking (movement events, appearance records,
# baton-touch history) is kept  Eability conditions read those.
headless = []
# Alloc tracker: counts every malloc/free, reports via RABUKA_ALLOC_TRACK env var
alloc_tracker = []
# Pooling global allocator for short-lived small allocations. OFF by default.
# It works and it is correct (full suite green, and the only bug it had  Ea
# headerless block returned to the system under the caller's smaller Layout  E# is fixed), but on the current tree it is worth only ~1.5% actions-per-second
# over the system allocator, with overlapping run-to-run spread. That is not
# worth a hand-written global allocator, which is the highest blast-radius code
# in a program and the last thing to want on the 3DS/wasm/PSP builds. Kept
# behind the flag so the A/B can be repeated when the allocation count moves
# again; re-measure before believing it.
fast_alloc = []
# Generic no_std flag  Eused in cfg gates so ports don't touch engine source
no_std = []
# PSP target: no_std + alloc mode for mipsel-sony-psp
psp = ["no_std", "debug_conditions", "bytecode_abilities", "compact_card_data"]
# DS target: no_std + alloc, minimal features for tight 4MB ROM
ds = ["no_std", "bytecode_abilities", "compact_cards", "compact_card_data", "compact_state"]
# PS1 target: no_std + alloc, compact like DS (2MB RAM; card data streams from CD)
ps1 = ["no_std", "bytecode_abilities", "compact_cards", "compact_card_data", "compact_state", "external_card_data"]
# GBA target: no_std + alloc via agb (baked deck blobs from the engine)
gba = ["no_std", "bytecode_abilities", "compact_all"]
# SNES target: no_std + alloc via rust-mos (mosw65816). Mirrors gba; the SNES
# can read card/bytecode data from ROM (LoROM up to 4MB) so the compact + baked
# data pipeline applies. Not yet buildable here (rust-mos not installed).
snes = ["no_std", "bytecode_abilities", "compact_all"]
# Dreamcast target: no_std + alloc via KallistiOS + rustc_codegen_gcc
dc = ["no_std", "debug_conditions", "bytecode_abilities", "compact_card_data"]
# Wii target: no_std + alloc via devkitPPC + libogc
wii = ["no_std", "bytecode_abilities", "compact_card_data"]
# Atari Jaguar target: no_std + alloc, compact like PS1 (2MB main RAM)
jaguar = ["no_std", "bytecode_abilities", "compact_all"]
# WebAssembly target: no_std + alloc, compact like GBA/Jaguar. Compiled to
# wasm32-unknown-unknown (or wasm32v1-none) and either interpreted (wasm3) or
# transpiled to C (w2c2/wasm2c) for consoles without a Rust backend.
wasm = ["no_std", "bytecode_abilities", "compact_all"]
# Philips CD-i target: m68k SCC68070 @ 15.5MHz, 1MB RAM, CD-ROM media.
# Same compact set as wasm/jaguar/gba  Enative m68k-unknown-none-elf via LLVM
# m68k backend (not wasm2c). Proves at ~150-300KB the engine fits 1MB; wasm2c
# at 3-4MB text does not.
cdi = ["no_std", "bytecode_abilities", "compact_all"]
# Sega Genesis / Mega Drive target: m68k 68000 @ 7.6MHz, 64KB RAM, 4MB cart ROM.
# Same compact set as GBA (per-deck baked blobs from ROM XIP, not full CARD_BLOB
# in RAM). Code executes from ROM (XIP), only heap/stack in 64KB work RAM.
genesis = ["no_std", "bytecode_abilities", "compact_all"]
# Bytecode abilities: use pre-compiled bytecode instead of JSON serde
# for ability loading. Dramatically reduces memory footprint (~7KB vs 1.4MB).
bytecode_abilities = []
# Compact cards: strips display-only fields (img, product, rare, ability text, faq)
# from the Card struct to reduce RAM on embedded/console targets.
compact_cards = []
# Compact card data: embeds a binary card blob in rodata and loads only deck
# cards into RAM. Dramatically reduces RAM for embedded/console targets (GBA).
compact_card_data = []
# PS1: card blob is loaded from the CD at runtime (2MB RAM can't hold it baked).
# card_binary reads the blob from platform-provided statics set after loading.
external_card_data = []
# Compact GameState: caps log/application Vecs to bounded sizes instead of
# unbounded accumulation. Reduces GameState RAM by ~80%+ for console targets.
compact_state = []
# Umbrella: enable all console/embedded optimizations at once.
console = ["compact_cards", "compact_state"]
# Umbrella: all three compact features for ROM-constrained targets
compact_all = ["compact_cards", "compact_card_data", "compact_state"]

[profile.dev]
# Trim DWARF to line tables only: cuts PDB size/link time dramatically.
# Tests don't need variable-level debugging; build time is king.
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

# Proc-macros and build scripts run at opt-0 by default; serde_derive etc.
# compile once but execute constantly. opt-level 1 costs seconds, saves minutes.
[profile.dev.build-override]
opt-level = 1

[[bench]]
# Requires the profiling feature so bare `cargo test` does not pull
# criterion + its dependency tree into every test build. Run benches with:
#   cargo bench --features profiling
name = "performance"
harness = false
required-features = ["profiling"]

[[example]]
name = "gen_flamegraph"
path = "examples/gen_flamegraph.rs"
required-features = ["profiling"]

