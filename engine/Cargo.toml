[package]
name = "rabuka_engine"
version = "0.1.0"
edition = "2021"

[lib]
doctest = false

[dependencies]
cfg-if = "1"
miniz_oxide = { version = "0.7", default-features = false, features = ["with-alloc"] }
log = { version = "=0.4.22", default-features = false }
env_logger = { version = "0.11", optional = true }
serde = { version = "=1.0.228", default-features = false, features = ["derive", "alloc", "rc"], optional = true }
serde_json = { version = "=1.0.99", default-features = false, features = ["alloc"], optional = true }
rand = { version = "0.8", optional = true }
actix-web = { version = "4.4", optional = true }
actix-cors = { version = "0.6", optional = true }
actix-files = { version = "0.6", optional = true }
tokio = { version = "1.35", features = ["full"], optional = true }
smallvec = { version = "1.11", default-features = false }
hashbrown = { version = "0.14", default-features = false }
uuid = { version = "1.6", features = ["v4", "serde"], optional = true }
local-ip-address = { version = "0.6", optional = true }
tokio-stream = { version = "0.1", optional = true }
bytes = { version = "1", optional = true }
rmp-serde = { version = "=1.3.1", optional = true }
[features]
default = ["env_logger", "debug_conditions", "rand", "rmp-serde", "bytecode_abilities", "json_path_test", "compact_card_data", "serde_support"]
debug_conditions = []
# JSON-path ability decode (serde) — used only by the bytecode↔JSON deep-compare
# oracle. Off for ds/no_std targets so the serde decode system is not compiled.
json_path_test = ["serde_support"]
# serde + serde_json + serde-capable smallvec/hashbrown. Disabled for console
# targets (ds/ps1/psp/wii/dc) where types are serialized via the binary blob.
serde_support = ["dep:serde", "dep:serde_json", "smallvec/serde", "hashbrown/serde"]
# Optional server feature: enables the web server and async runtime
server = ["actix-web", "actix-cors", "actix-files", "tokio", "tokio-stream", "local-ip-address", "uuid", "bytes", "serde_support"]
# 3DS target: disables TLS-based RNG, uses xorshift64 seeded from svcGetSystemTick
3ds = ["bytecode_abilities"]
# Profiling: enables Timer-based instrumentation for flamegraph generation
profiling = []
# Headless bot-testing mode: compiles out UI-only bookkeeping (rule/structured
# logs, phase-transition log entries, choice_resolved capture, jyouji status
# strings). Gameplay-relevant tracking (movement events, appearance records,
# baton-touch history) is kept — ability conditions read those.
headless = []
# Alloc tracker: counts every malloc/free, reports via RABUKA_ALLOC_TRACK env var
alloc_tracker = []
# Generic no_std flag — used in cfg gates so ports don't touch engine source
no_std = []
# PSP target: no_std + alloc mode for mipsel-sony-psp
psp = ["no_std", "debug_conditions", "bytecode_abilities", "compact_card_data"]
# DS target: no_std + alloc, minimal features for tight 4MB ROM
ds = ["no_std", "bytecode_abilities", "compact_cards", "compact_card_data", "compact_state"]
# PS1 target: no_std + alloc, compact like DS (2MB RAM; card data streams from CD)
ps1 = ["no_std", "bytecode_abilities", "compact_cards", "compact_card_data", "compact_state", "external_card_data"]
# GBA target: no_std + alloc via agb (baked deck blobs from the engine)
gba = ["no_std", "bytecode_abilities", "compact_all"]
# SNES target: no_std + alloc via rust-mos (mosw65816). Mirrors gba; the SNES
# can read card/bytecode data from ROM (LoROM up to 4MB) so the compact + baked
# data pipeline applies. Not yet buildable here (rust-mos not installed).
snes = ["no_std", "bytecode_abilities", "compact_all"]
# Dreamcast target: no_std + alloc via KallistiOS + rustc_codegen_gcc
dc = ["no_std", "debug_conditions", "bytecode_abilities", "compact_card_data"]
# Wii target: no_std + alloc via devkitPPC + libogc
wii = ["no_std", "bytecode_abilities", "compact_card_data"]
# Atari Jaguar target: no_std + alloc, compact like PS1 (2MB main RAM)
jaguar = ["no_std", "bytecode_abilities", "compact_all"]
# WebAssembly target: no_std + alloc, compact like GBA/Jaguar. Compiled to
# wasm32-unknown-unknown (or wasm32v1-none) and either interpreted (wasm3) or
# transpiled to C (w2c2/wasm2c) for consoles without a Rust backend.
wasm = ["no_std", "bytecode_abilities", "compact_all"]
# Philips CD-i target: m68k SCC68070 @ 15.5MHz, 1MB RAM, CD-ROM media.
# Same compact set as wasm/jaguar/gba — native m68k-unknown-none-elf via LLVM
# m68k backend (not wasm2c). Proves at ~150-300KB the engine fits 1MB; wasm2c
# at 3-4MB text does not.
cdi = ["no_std", "bytecode_abilities", "compact_all"]
# Sega Genesis / Mega Drive target: m68k 68000 @ 7.6MHz, 64KB RAM, 4MB cart ROM.
# Same compact set as GBA (per-deck baked blobs from ROM XIP, not full CARD_BLOB
# in RAM). Code executes from ROM (XIP), only heap/stack in 64KB work RAM.
genesis = ["no_std", "bytecode_abilities", "compact_all"]
# Bytecode abilities: use pre-compiled bytecode instead of JSON serde
# for ability loading. Dramatically reduces memory footprint (~7KB vs 1.4MB).
bytecode_abilities = []
# Compact cards: strips display-only fields (img, product, rare, ability text, faq)
# from the Card struct to reduce RAM on embedded/console targets.
compact_cards = []
# Compact card data: embeds a binary card blob in rodata and loads only deck
# cards into RAM. Dramatically reduces RAM for embedded/console targets (GBA).
compact_card_data = []
# PS1: card blob is loaded from the CD at runtime (2MB RAM can't hold it baked).
# card_binary reads the blob from platform-provided statics set after loading.
external_card_data = []
# Compact GameState: caps log/application Vecs to bounded sizes instead of
# unbounded accumulation. Reduces GameState RAM by ~80%+ for console targets.
compact_state = []
# Umbrella: enable all console/embedded optimizations at once.
console = ["compact_cards", "compact_state"]
# Umbrella: all three compact features for ROM-constrained targets
compact_all = ["compact_cards", "compact_card_data", "compact_state"]

[profile.dev]
# Trim DWARF to line tables only: cuts PDB size/link time dramatically.
# Tests don't need variable-level debugging; build time is king.
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

# Proc-macros and build scripts run at opt-0 by default; serde_derive etc.
# compile once but execute constantly. opt-level 1 costs seconds, saves minutes.
[profile.dev.build-override]
opt-level = 1

[dev-dependencies]
criterion = "0.5"
inferno = "0.12"
rayon = "1.8"
rand_chacha = "0.3"
bincode = "1.3"

[[bench]]
# Requires the profiling feature so bare `cargo test` does not pull
# criterion + its dependency tree into every test build. Run benches with:
#   cargo bench --features profiling
name = "performance"
harness = false
required-features = ["profiling"]

[[bin]]
name = "rabuka_engine"
path = "src/main.rs"
test = false

[[bin]]
name = "profile_target"
path = "src/bin/profile_target.rs"
test = false

[[bin]]
name = "harness"
path = "src/bin/harness.rs"
test = false

[[bin]]
name = "rabuka_3ds"
path = "src/bin/rabuka_3ds.rs"
test = false

[[bin]]
name = "bot_demo"
path = "src/bin/bot_demo.rs"
test = false

[[bin]]
name = "bot_data_gen"
path = "src/bin/bot_data_gen.rs"
test = false

[[bin]]
name = "play_game"
path = "src/bin/play_game.rs"
test = false

[[bin]]
name = "collect_data"
path = "src/bin/collect_data.rs"
test = false

[[bin]]
name = "ppo_collect"
path = "src/bin/ppo_collect.rs"
test = false

[[bin]]
name = "test_hang"
path = "src/bin/test_hang.rs"
test = false

[[bin]]
name = "trace_game"
path = "src/bin/trace_game.rs"
test = false

# Dev/debug tools — declared explicitly with test = false so bare `cargo test`
# doesn't build and run each one as an empty test harness.
[[bin]]
name = "bad_game_report"
path = "src/bin/bad_game_report.rs"
test = false

[[bin]]
name = "bot_arena"
path = "src/bin/bot_arena.rs"
test = false

[[bin]]
name = "calibrate"
path = "src/bin/calibrate.rs"
test = false

[[bin]]
name = "diag_stall"
path = "src/bin/diag_stall.rs"
test = false

[[bin]]
name = "hunt_loop"
path = "src/bin/hunt_loop.rs"
test = false

# These two were previously auto-discovered from src/bin/ — without explicit
# entries, bare `cargo test` built an empty unittest harness for each.
[[bin]]
name = "describe_dump"
path = "src/bin/describe_dump.rs"
test = false

[[bin]]
name = "turn_replay"
path = "src/bin/turn_replay.rs"
test = false
