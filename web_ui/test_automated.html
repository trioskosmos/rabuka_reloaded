<!DOCTYPE html>
<html>
<head>
    <title>Automated Frontend Test</title>
</head>
<body>
    <h1>Automated Frontend Test</h1>
    <div id="log"></div>
    <script>
        async function testFrontend() {
            const log = document.getElementById('log');
            
            function addLog(msg) {
                const div = document.createElement('div');
                div.textContent = msg;
                log.appendChild(div);
                console.log(msg);
            }
            
            try {
                addLog('=== AUTOMATED FRONTEND TEST ===');
                
                // Wait for page to load
                await new Promise(resolve => setTimeout(resolve, 2000));
                
                // Open game setup modal
                addLog('1. Opening game setup...');
                const setupButton = document.querySelector('[data-action="open-setup-modal"]');
                if (!setupButton) {
                    addLog('❌ Setup button not found');
                    return;
                }
                setupButton.click();
                
                // Wait for decks to populate
                addLog('2. Waiting for decks to load...');
                let decksLoaded = false;
                for (let i = 0; i < 20; i++) {
                    await new Promise(resolve => setTimeout(resolve, 500));
                    const p0Select = document.getElementById('p0-deck-select');
                    if (p0Select && p0Select.options.length > 2) {
                        // Pick deck with most cards (parse "(N cards)" from text)
                        let bestOpt = null, bestCount = 0;
                        for (let j = 0; j < p0Select.options.length; j++) {
                            const opt = p0Select.options[j];
                            if (opt.value === 'paste' || opt.value === 'random' || opt.value === 'manual') continue;
                            const m = opt.textContent.match(/\((\d+)\s*cards?\)/i);
                            const cnt = m ? parseInt(m[1], 10) : 0;
                            if (cnt > bestCount) { bestCount = cnt; bestOpt = opt; }
                        }
                        if (bestOpt) {
                            p0Select.value = bestOpt.value;
                            if (window.onDeckSelectChange) window.onDeckSelectChange(0, bestOpt.value);
                            addLog(`   P1 deck: ${bestOpt.textContent}`);
                        }
                        const p1Select = document.getElementById('p1-deck-select');
                        if (p1Select) {
                            bestOpt = null; bestCount = 0;
                            for (let j = 0; j < p1Select.options.length; j++) {
                                const opt = p1Select.options[j];
                                if (opt.value === 'paste' || opt.value === 'random' || opt.value === 'manual') continue;
                                const m = opt.textContent.match(/\((\d+)\s*cards?\)/i);
                                const cnt = m ? parseInt(m[1], 10) : 0;
                                if (cnt > bestCount) { bestCount = cnt; bestOpt = opt; }
                            }
                            if (bestOpt) {
                                p1Select.value = bestOpt.value;
                                if (window.onDeckSelectChange) window.onDeckSelectChange(1, bestOpt.value);
                                addLog(`   P2 deck: ${bestOpt.textContent}`);
                            }
                        }
                        decksLoaded = true;
                        break;
                    }
                }
                
                if (!decksLoaded) {
                    addLog('❌ Decks did not load');
                    return;
                }
                
                // Start game with selected decks (sandbox auto-resolves RPS and turn choice)
                addLog('3. Starting game...');
                const submitButton = document.querySelector('[data-action="submit-game-setup"]');
                if (!submitButton) {
                    addLog('❌ Submit button not found');
                    return;
                }
                submitButton.click();
                
                // Wait for sandbox auto-resolve to complete RPS + turn choice
                addLog('3. Waiting for sandbox auto-resolve (RPS + turn choice)...');
                let mulliganPhase = false;
                for (let i = 0; i < 30; i++) {
                    await new Promise(resolve => setTimeout(resolve, 1000));
                    const phase = window.State?.data?.phase;
                    addLog(`   Poll ${i + 1}: phase = ${phase}`);
                    if (phase && (phase.startsWith('Mulligan') || phase === 'Main')) {
                        mulliganPhase = true;
                        break;
                    }
                }
                
                if (!mulliganPhase) {
                    addLog('❌ Did not reach mulligan or main phase');
                    return;
                }
                
                const phase = window.State?.data?.phase;
                addLog('4. Reached phase: ' + phase);
                
                // Check that main deck has enough cards
                const state = window.State?.data;
                const p1 = state?.player1;
                if (p1?.deck?.cards) {
                    addLog(`P1 main deck: ${p1.deck.cards.length} cards`);
                    if (p1.deck.cards.length < 20) {
                        addLog('❌ Main deck too small (< 20 cards)');
                        return;
                    }
                }
                
                addLog('=== TEST PASSED ===');
                addLog('Game started successfully with sufficient cards');
                
            } catch (error) {
                addLog('=== TEST FAILED ===');
                addLog('Error: ' + error.message);
                console.error(error);
            }
        }
        
        // Auto-start test after page loads
        window.addEventListener('load', () => {
            setTimeout(testFrontend, 1000);
        });
    </script>
</body>
</html>
