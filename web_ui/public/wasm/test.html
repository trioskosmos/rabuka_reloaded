<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Rabuka WASM Test</title>
</head>
<body>
    <h1>Rabuka WASM Test</h1>
    <button id="initBtn">Initialize Engine</button>
    <button id="actionBtn" disabled>Execute Action (Pass)</button>
    <pre id="output"></pre>

    <!-- NOTE: this page sits next to the wasm-bindgen glue
         (rabuka_wasm.js / rabuka_wasm_bg.wasm), served at /wasm/ by the
         backend and at /wasm/ (+/public/wasm/) on GitHub Pages. Always load
         through the generated glue — hand-rolled WebAssembly.instantiate
         with stub imports cannot satisfy wasm-bindgen's externref/memory
         imports and will always fail. -->
    <script type="module">
        import init, { WasmGameEngine, wasm_seed, wasm_rand_range } from './rabuka_wasm.js';

        const output = document.getElementById('output');
        const initBtn = document.getElementById('initBtn');
        const actionBtn = document.getElementById('actionBtn');

        function log(msg) {
            output.textContent += msg + '\n';
            console.log(msg);
        }

        let engine = null;

        async function initWasm() {
            log('Loading WASM via wasm-bindgen glue...');
            // No args: resolves rabuka_wasm_bg.wasm relative to this file.
            await init();
            log('WASM instantiated!');
            log('Exports: WasmGameEngine, wasm_seed, wasm_rand_range, wasm_shuffle');

            wasm_seed(0x5EED);
            log('RNG seeded; rand_range(100) = ' + wasm_rand_range(100));

            // Minimal smoke config: empty decks still construct the engine
            // (real decks come from the app via WasmGameService).
            engine = new WasmGameEngine({
                seed: 0x5EED,
                p1_deck: [],
                p2_deck: [],
                p1_energy: [],
                p2_energy: [],
            });
            log('WasmGameEngine constructed; phase = ' + engine.get_phase());
            actionBtn.disabled = false;
        }

        initBtn.addEventListener('click', async () => {
            try {
                await initWasm();
                initBtn.disabled = true;
            } catch (e) {
                log('Error: ' + e.message);
                console.error(e);
            }
        });

        actionBtn.addEventListener('click', async () => {
            if (!engine) return;
            try {
                log('Legal actions: ' + JSON.stringify(engine.get_legal_actions()).slice(0, 300));
                log('Frame: ' + engine.get_frame_counter().toString() + ' phase: ' + engine.get_phase());
            } catch (e) {
                log('Action error: ' + e.message);
            }
        });
    </script>
</body>
</html>
