[package]
name = "rabuka_ds"
version = "0.1.0"
edition = "2021"

[dependencies]
rabuka_engine = { path = "../../engine", default-features = false, features = ["ds"] }
hashbrown = { version = "0.14", default-features = false }
log = { version = "0.4", default-features = false }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true
panic = "abort"

[[bin]]
name = "rabuka_ds"
path = "src/bin/rabuka_ds.rs"
