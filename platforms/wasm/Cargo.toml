[package]
name = "rabuka_wasm"
version = "0.1.0"
authors = ["Rabuka Reloaded"]
edition = "2021"
description = "Rabuka Reloaded engine compiled to WebAssembly for browser gameplay"

[lib]
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
rabuka_engine = { path = "../../engine", default-features = false, features = ["wasm", "serde_support"] }
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
console_error_panic_hook = "0.1"
rmp-serde = "1.3"

[features]
default = ["wasm"]
wasm = ["rabuka_engine/wasm"]
jaguar = ["rabuka_engine/jaguar"]

[profile.release]
opt-level = "z"
panic = "abort"
lto = true
codegen-units = 1

[profile.dev]
opt-level = 1
debug = "line-tables-only"