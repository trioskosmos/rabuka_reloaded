[package]
name = "rabuka_3ds"
version = "0.1.0"
edition = "2021"

[dependencies]
rabuka_engine = { path = "../../engine", default-features = false, features = ["bytecode_abilities", "rmp-serde", "serde_support"] }
serde = { version = "=1.0.228", default-features = false, features = ["alloc", "rc"] }
serde_json = "1.0"
rmp-serde = "1.3.1"
# Local stub: satisfies cargo-3ds's ctru_sys unit-graph probe so it stops
# warning. Never linked; rabuka_3ds links libctru directly via its own FFI shim.
ctru-sys = { path = "ctru-sys" }

[features]
default = []
3ds = ["rabuka_engine/3ds"]

[[bin]]
name = "rabuka_3ds"
path = "src/bin/rabuka_3ds.rs"

[[bin]]
name = "bake"
path = "src/bin/bake.rs"



[package.metadata.cargo-3ds]
romfs_dir = "romfs"
