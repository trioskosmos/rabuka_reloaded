[package]
name = "rabuka_dc"
version = "0.1.0"
edition = "2021"

[dependencies]
rabuka_engine = { path = "../../engine", default-features = false, features = ["env_logger", "debug_conditions"] }
hashbrown = { version = "0.14" }
smallvec = { version = "1" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = { version = "0.2", default-features = false, features = ["custom"] }
libc = "=0.2.186"

[patch.crates-io]
libc = { path = "/opt/toolchains/dc/rust/libc" }

[[bin]]
name = "rabuka_dc"
path = "src/bin/rabuka_dc.rs"

[profile.release]
codegen-units = 1
lto = true
opt-level = 2
panic = "abort"
