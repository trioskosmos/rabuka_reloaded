[package]
name = "rabuka_psp"
version = "0.1.0"
edition = "2021"

[dependencies]
rabuka_engine = { path = "../../engine", default-features = false, features = ["psp"] }
psp = { version = "0.3", features = ["embedded-graphics"], optional = true }
hashbrown = { version = "0.14", default-features = false, features = ["serde"] }
smallvec = { version = "1", default-features = false }
embedded-graphics = { version = "0.8", optional = true }
log = { version = "0.4", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[patch.crates-io]
psp = { path = "vendored/psp" }

[features]
default = []
psp = ["dep:psp", "dep:embedded-graphics"]

[[bin]]
name = "rabuka_psp"
path = "src/bin/rabuka_psp.rs"
required-features = ["psp"]

# bake_cards moved to tools/bake_cards/ (standalone crate for host builds)

[profile.release]
codegen-units = 16
lto = true
opt-level = 2
