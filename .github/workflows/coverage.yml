name: Coverage Inventory Check

on:
  push:
    paths:
      - 'cards/abilities.json'
      - 'cards/test_inventory.py'
      - 'cards/ability_docs_scripts/**'
      - 'engine/tests/**'
      - 'engine/src/ability/**'
      - 'cards/ability_extraction/**'
      - 'cards/generate_condition_decoder.py'
      - 'engine/src/core/card.rs'
  pull_request:
    paths:
      - 'cards/abilities.json'
      - 'cards/test_inventory.py'
      - 'cards/ability_docs_scripts/**'
      - 'engine/tests/**'
      - 'engine/src/ability/**'
      - 'cards/ability_extraction/**'
      - 'cards/generate_condition_decoder.py'
      - 'engine/src/core/card.rs'
  workflow_dispatch:

jobs:
  coverage-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check inventory is fresh
        run: |
          python cards/test_inventory.py --check
          echo "Coverage inventory is up-to-date."

      - name: Validate parser round-trip against baseline
        run: |
          python cards/ability_extraction/extract_card_abilities.py --validate-only --check

      - name: Generated decoders are fresh
        run: |
          # The condition/effect decoders are AUTO-GENERATED from card.rs.
          # Hand-editing them (or stale output after a card.rs change) must
          # fail CI instead of being silently overwritten locally.
          cp engine/src/ability/condition_decoder_gen.rs /tmp/cond_before.rs
          (cd cards && python generate_condition_decoder.py)
          diff -u /tmp/cond_before.rs engine/src/ability/condition_decoder_gen.rs \
            || { echo "::error::condition_decoder_gen.rs is stale or hand-edited. Run: python cards/generate_condition_decoder.py"; exit 1; }
          echo "Generated decoders are up-to-date."

      - name: Summary
        run: |
          echo "Docs generated:"
          ls -lh docs/ABILITY_MATRIX.md engine/tests/TEST_COVERAGE.md engine/tests/TEST_INVENTORY.json | cat
