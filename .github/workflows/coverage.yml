name: Coverage Inventory Check

on:
  push:
    paths:
      - 'cards/abilities.json'
      - 'cards/cards.json'
      - 'cards/test_inventory.py'
      - 'cards/ability_docs_scripts/**'
      - 'cards/ability_extraction/**'
      - 'cards/compile_abilities.py'
      - 'cards/generate_condition_decoder.py'
      - 'cards/generate_effect_decoder.py'
      - 'engine/tests/**'
      - 'engine/src/ability/**'
      - 'engine/src/core/card.rs'
      - '.github/workflows/coverage.yml'
  pull_request:
    paths:
      - 'cards/abilities.json'
      - 'cards/cards.json'
      - 'cards/test_inventory.py'
      - 'cards/ability_docs_scripts/**'
      - 'cards/ability_extraction/**'
      - 'cards/compile_abilities.py'
      - 'cards/generate_condition_decoder.py'
      - 'cards/generate_effect_decoder.py'
      - 'engine/tests/**'
      - 'engine/src/ability/**'
      - 'engine/src/core/card.rs'
      - '.github/workflows/coverage.yml'
  workflow_dispatch:

jobs:
  coverage-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check inventory is fresh
        run: |
          python cards/test_inventory.py --check
          echo "Coverage inventory is up-to-date."

      - name: Validate parser round-trip against baseline
        run: |
          python cards/ability_extraction/extract_card_abilities.py --validate-only --check

      - name: Generated decoders are fresh
        run: |
          # The condition/effect decoders are AUTO-GENERATED from card.rs.
          # Hand-editing them (or stale output after a card.rs change) must
          # fail CI instead of being silently overwritten locally.
          cp engine/src/ability/condition_decoder_gen.rs /tmp/cond_before.rs
          (cd cards && python generate_condition_decoder.py)
          diff -u /tmp/cond_before.rs engine/src/ability/condition_decoder_gen.rs \
            || { echo "::error::condition_decoder_gen.rs is stale or hand-edited. Run: python cards/generate_condition_decoder.py"; exit 1; }
          cp engine/src/ability/effect_decoder_gen.rs /tmp/eff_before.rs
          (cd cards && python generate_effect_decoder.py)
          diff -u /tmp/eff_before.rs engine/src/ability/effect_decoder_gen.rs \
            || { echo "::error::effect_decoder_gen.rs is stale or hand-edited. Run: python cards/generate_effect_decoder.py"; exit 1; }
          echo "Generated decoders are up-to-date."

      - name: Generated ability bytecode is fresh
        run: |
          # abilities_gen.rs is AUTO-GENERATED from abilities.json by
          # compile_abilities.py, and it is the file the engine actually bakes its
          # abilities from. The decoder step above covers the two decoder files, but
          # nothing covered this one, so a hand-edit — or a stale blob left behind
          # after an abilities.json change — passed CI and then silently disagreed
          # with the card data the rest of the suite reads.
          #
          # cards_gen.rs is deliberately NOT checked here: it is gitignored
          # (.gitignore:208), so it is a local build artifact rather than a
          # reviewable file, and hand-editing it has no effect on anyone else.
          (cd cards && python ability_extraction/extract_card_abilities.py > /dev/null)
          (cd cards && python compile_abilities.py > /dev/null)
          git diff --exit-code -- engine/src/ability/abilities_gen.rs \
            || { echo "::error::abilities_gen.rs is stale or hand-edited. Run: python cards/ability_extraction/extract_card_abilities.py && python cards/compile_abilities.py"; exit 1; }
          echo "Generated ability bytecode is up-to-date."

      - name: Summary
        run: |
          echo "Docs generated:"
          ls -lh docs/ABILITY_MATRIX.md engine/tests/TEST_COVERAGE.md engine/tests/TEST_INVENTORY.json | cat
