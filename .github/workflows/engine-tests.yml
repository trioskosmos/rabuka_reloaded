name: Engine Tests

on:
  push:
    paths:
      - 'engine/**'
      - 'cards/abilities.json'
      - 'cards/cards.json'
      - 'cards/compile_abilities.py'
      - 'cards/compile_cards.py'
      - 'cards/build_lib.py'
      - 'cards/ability_extraction/**'
      - 'cards/generate_condition_decoder.py'
      - 'cards/generate_effect_decoder.py'
      - 'cards/build/generation_manifest.json'
      - '.github/workflows/engine-tests.yml'
  pull_request:
    paths:
      - 'engine/**'
      - 'cards/abilities.json'
      - 'cards/cards.json'
      - 'cards/compile_abilities.py'
      - 'cards/compile_cards.py'
      - 'cards/build_lib.py'
      - 'cards/ability_extraction/**'
      - 'cards/generate_condition_decoder.py'
      - 'cards/generate_effect_decoder.py'
      - 'cards/build/generation_manifest.json'
      - '.github/workflows/engine-tests.yml'
  workflow_dispatch:

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('engine/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run engine test suite
        working-directory: engine
        run: cargo test --test run_all --locked

      # The `#[cfg(test)]` modules inside `engine/src` are a separate target from
      # the `run_all` integration test, so the step above never compiled or ran them.
      # They are not redundant with run_all — as of this change 119 of them live in
      # src (ability/util/duration.rs, ability/queue.rs, ability/describe.rs,
      # core/observation.rs, the bot's strategy modules), including the
      # `parse_duration` assertions that pin the duration vocabulary. Without this
      # step all 119 pass in CI by not existing.
      - name: Run library unit tests
        working-directory: engine
        run: cargo test --lib --locked
