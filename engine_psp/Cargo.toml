[package]
name = "rabuka_psp"
version = "0.1.0"
edition = "2021"

[dependencies]
rabuka_engine = { path = "../engine", default-features = false, features = ["psp"] }
psp = { version = "0.3", features = ["embedded-graphics"] }
hashbrown = { version = "0.14", default-features = false, features = ["alloc"] }
smallvec = { version = "1", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
rmp-serde = { version = "1", default-features = false }
embedded-graphics = "0.8"
log = { version = "0.4", default-features = false }

[features]
default = []

[[bin]]
name = "rabuka_psp"
path = "src/bin/rabuka_psp.rs"

[profile.release]
codegen-units = 16
lto = true
opt-level = 2
